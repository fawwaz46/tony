# CI for tony's own repo: runs the test suite and proves the viewer bundle and
# the site still build. Nothing here touches a user's repo — deploys of the
# site happen through Vercel, and PyPI releases happen in release.yml when a
# version tag is pushed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Both jobs run build-time code from the branch under test (`pip install -e`,
# `npm ci`). Nothing here writes to the repo, so nothing here needs a token
# that could — and this does not depend on the org's default being right.
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest src/tests -q
      # The installer must never ask for a version this repo has not released.
      # Asking for one it cannot get is how the first install attempt failed.
      - run: python .github/check_installer_floor.py

  viewer-and-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: web
      - run: npm run build:viewer
        working-directory: web
      # A hostile payload must never render as markup — any account can upload one.
      - run: npm test
        working-directory: web
      # The committed bundle must match the source it claims to be built from.
      - run: git diff --exit-code src/tony_cli/assets/viewer.js src/tony_cli/assets/viewer.css
      # Same for the installer the site serves at /install.sh.
      - run: npm run sync:install
        working-directory: web
      - run: git diff --exit-code web/public/install.sh
      - run: npm run build
        working-directory: web
