# Publishes tony-cli to PyPI when a version tag is pushed.
#
#   git tag v0.2.1 && git push origin v0.2.1
#
# Releases go out through PyPI Trusted Publishing (OIDC), so there is no API
# token stored in this repo. The trusted publisher is configured on PyPI
# against this workflow filename and the `pypi` environment below; changing
# either name means updating that configuration too.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The tag is the only input, and it is a claim about what is in the tree.
  # Check it against pyproject before anything is built or uploaded — a PyPI
  # version cannot be replaced once it exists, only yanked.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tag must match the version in pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, pyproject.toml says $pkg" >&2
            exit 1
          fi
          echo "releasing $pkg"

      # Publishing is irreversible, so the suite runs here too rather than
      # trusting that the commit was green when it landed on main.
      - run: pip install -e ".[dev]"
      - run: python -m pytest src/tests -q

      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # mints the OIDC token PyPI trades for an upload token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The failure this repo has already shipped once: an installer asking for a
  # version PyPI does not serve. Prove the release works the way a user meets
  # it — the real install.sh, then the real updater — before calling it done.
  smoke:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: pipx, and the directory it puts commands in
        run: |
          python -m pip install --user pipx
          # install.sh looks for pipx on PATH, and pipx installs `tony` here.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # install.sh asks for a floor, not this exact version, so a fresh upload
      # that has not reached the index yet installs the PREVIOUS release and
      # succeeds. Retrying only on failure never noticed. Retry until the
      # version on disk is the one just tagged.
      - name: Install the way the website tells people to
        run: |
          want="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5 6 7 8; do
            sh install.sh || true
            got="$(tony --version 2>/dev/null | awk '{print $2}')"
            if [ "$got" = "$want" ]; then
              echo "installed $got"
              exit 0
            fi
            echo "index still serving ${got:-nothing}, want $want (attempt $attempt)"
            sleep 20
          done
          echo "install.sh never installed $want" >&2
          exit 1

      # `tony update` is the one command whose failure mode is silence: every
      # installer exits 0 for "already at latest", so a broken updater looks
      # exactly like a working one. On a machine that just installed the newest
      # release, the only correct answer is that there is nothing to do.
      - name: The updater knows it is current
        run: |
          out="$(tony update)"
          echo "$out"
          echo "$out" | grep -q "already on the latest version" || {
            echo "update did not recognise the newest release as current" >&2
            exit 1
          }
